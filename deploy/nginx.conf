# /etc/nginx/sites-available/dialogue-futures
# Serves the built React app and proxies /api to the FastAPI service.
# After editing:  nginx -t && systemctl reload nginx
# TLS:            certbot --nginx -d dialogue.juooa.cloud

server {
    listen 80;
    server_name dialogue.juooa.cloud;

    client_max_body_size 2m;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/dialogue-futures/frontend/dist;
    index index.html;

    # hashed assets — safe to cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8071;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA routes: /student, /faculty, /admin all resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
